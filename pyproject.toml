[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "DecNefSimulator"
description = 
version = "1.0.0"
authors = [{name="Alexander Olza"}]
license = 
license_files = "LICENSE"
readme = "README.md"
keywords = ["DecNef", "Decoded Neurofeedback" "Cognitive neuroscience"]

[project.urls]
Homepage = "https://github.com/AlexOlza/DecNefSimulator"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
